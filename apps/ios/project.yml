name: Negroni
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: '17.0'
packages:
  NegroniCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: '5.0'
    CURRENT_PROJECT_VERSION: '34'
    MARKETING_VERSION: '1.0.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    SUPPORTS_MACCATALYST: NO
targets:
  Negroni:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
      - path: .build-config/ClientConfiguration.plist
        buildPhase: resources
    dependencies:
      - package: NegroniCore
    info:
      path: .build-config/Info.plist
      properties:
        CFBundleDisplayName: Negroni
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [negroni, rakazo]
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        NSMicrophoneUsageDescription: Dictate messages to your assistant.
        NSPhotoLibraryUsageDescription: Attach photos to a conversation.
        NSLocalNetworkUsageDescription: Connect to the Negroni server on your computer.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [remote-notification]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    entitlements:
      path: .build-config/Negroni.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.artempaskov.aisy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
schemes:
  Negroni:
    build:
      targets:
        Negroni: all
    run:
      config: Debug
    archive:
      config: Release
