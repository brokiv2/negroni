name: desktop-macos-screenshot
on:
  push:
    branches: [main]
    paths: &desktop-setup-paths
      - ".github/workflows/desktop-macos-screenshot.yml"
      - "apps/desktop/e2e/setup.spec.ts"
      - "apps/desktop/package.json"
      - "apps/desktop/assets/**"
      - "packages/ui-tokens/assets/**"
      - "apps/desktop/scripts/copy-static.mjs"
      - "apps/desktop/src/setup*"
      - "apps/desktop/src/window-options.ts"
      - "packages/contracts/src/desktop.ts"
  pull_request:
    paths: *desktop-setup-paths

permissions:
  contents: read

concurrency:
  group: desktop-macos-screenshot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  screenshot:
    name: macOS setup screenshot
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rakazo/desktop build
      - name: Verify packaged Tahoe icon and legacy fallback
        run: |
          pnpm --filter @rakazo/web build
          CSC_IDENTITY_AUTO_DISCOVERY=false pnpm --filter @rakazo/desktop exec electron-builder --mac --dir --publish never -c.mac.identity=null -c.mac.notarize=false
          app="$(node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, readdirSync, readFileSync } from 'node:fs';
          import path from 'node:path';

          const desktop = path.resolve('apps/desktop');
          const metadata = JSON.parse(readFileSync(path.join(desktop, 'package.json'), 'utf8'));
          const output = path.resolve(desktop, metadata.build.directories.output);
          const productName = metadata.build.productName || metadata.productName || metadata.name;
          const apps = readdirSync(output, { withFileTypes: true })
            .filter((entry) => entry.isDirectory() && /^mac(?:-|$)/.test(entry.name))
            .flatMap((entry) => readdirSync(path.join(output, entry.name), { withFileTypes: true })
              .filter((bundle) => bundle.isDirectory() && bundle.name.endsWith('.app'))
              .map((bundle) => path.join(output, entry.name, bundle.name)));
          if (apps.length !== 1) throw new Error(`Expected one packaged macOS app, found ${apps.length}`);
          const app = apps[0];
          const plist = path.join(app, 'Contents', 'Info.plist');
          const readPlist = (key) => execFileSync('/usr/libexec/PlistBuddy', ['-c', `Print :${key}`, plist], { encoding: 'utf8' }).trim();
          if (readPlist('CFBundleName') !== productName) throw new Error('Packaged app does not match productName');
          const executable = path.join(app, 'Contents', 'MacOS', readPlist('CFBundleExecutable'));
          appendFileSync(process.env.GITHUB_ENV, `RAKAZO_E2E_EXECUTABLE=${executable}\n`);
          process.stdout.write(app);
          NODE
          )"
          xcrun assetutil --info "$app/Contents/Resources/Assets.car" > "$RUNNER_TEMP/icon-assets.json"
          jq -e 'any(.[]; .Name == "Icon" and .AssetType == "IconImageStack") and any(.[]; .Name == "Icon_Assets/orange-bot" and .AssetType == "Image")' "$RUNNER_TEMP/icon-assets.json"
          iconutil -c iconset "$app/Contents/Resources/icon.icns" -o "$RUNNER_TEMP/fallback.iconset"
          sips -s format png "$RUNNER_TEMP/fallback.iconset/icon_128x128@2x.png" --out "$RUNNER_TEMP/fallback-decoded.png"
          test -s "$RUNNER_TEMP/fallback-decoded.png"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$app/Contents/Info.plist")" = Icon
        env:
          RAKAZO_ALLOW_DEV_SECRETS: "1"
      - name: Capture packaged macOS setup window and Dock
        run: >-
          pnpm --filter @rakazo/desktop exec playwright test
          --config e2e/playwright.config.ts setup.spec.ts
          --grep "first run asks whether to use a local or existing instance"
      - name: Upload native macOS setup screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-e2e-macos-screenshot
          path: |
            apps/desktop/e2e/screenshots/08-setup-macos-native-controls.png
            apps/desktop/e2e/screenshots/09-macos-dock.png
          if-no-files-found: error
          retention-days: 1
